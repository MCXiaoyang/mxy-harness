<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mxy-harness</title>
<style>
:root{
  --bg:#0e1116; --bg2:#161b22; --bg3:#1c232c;
  --fg:#e6edf3; --fg2:#8b949e; --line:#2a3038;
  --accent:#4f8cff; --accent2:#2f6fe0;
  --user:#22304a; --ai:#181d24;
  --danger:#e5534b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--fg); overflow:hidden;
}
#app{display:flex; height:100vh}

/* ---------- 侧栏 ---------- */
#sidebar{
  width:260px; flex:0 0 260px; background:var(--bg2);
  border-right:1px solid var(--line); display:flex; flex-direction:column;
}
.side-head{padding:12px;border-bottom:1px solid var(--line)}
.side-head button{
  width:100%; padding:10px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg3); color:var(--fg); cursor:pointer; font-size:13px;
  transition:.15s;
}
.side-head button:hover{background:var(--accent); border-color:var(--accent)}
#conv-list{flex:1; overflow-y:auto; padding:8px}
.conv-item{
  padding:10px 12px; border-radius:8px; cursor:pointer; font-size:13px;
  color:var(--fg2); margin-bottom:2px; display:flex; align-items:center;
  justify-content:space-between; gap:8px;
}
.conv-item:hover{background:var(--bg3); color:var(--fg)}
.conv-item.active{background:var(--bg3); color:var(--fg); border-left:2px solid var(--accent)}
.conv-item .t{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.conv-item .x{
  opacity:0; font-size:14px; color:var(--fg2); padding:0 2px;
}
.conv-item:hover .x{opacity:1}
.conv-item .x:hover{color:var(--danger)}
.side-foot{padding:10px; border-top:1px solid var(--line)}
.side-foot button{
  width:100%; padding:8px; border-radius:8px; border:1px solid var(--line);
  background:transparent; color:var(--fg2); cursor:pointer; font-size:13px;
}
.side-foot button:hover{color:var(--fg); border-color:var(--accent)}

/* ---------- 主区 ---------- */
#main{flex:1; display:flex; flex-direction:column; min-width:0}
#topbar{
  height:52px; flex:0 0 52px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; padding:0 16px; gap:12px; background:var(--bg2);
}
#title{flex:1; font-size:14px; font-weight:600; overflow:hidden;
       text-overflow:ellipsis; white-space:nowrap}
#model-select{
  background:var(--bg3); color:var(--fg); border:1px solid var(--line);
  border-radius:6px; padding:6px 10px; font-size:13px; outline:none;
}
#messages{flex:1; overflow-y:auto; padding:24px 0}
#messages .wrap{max-width:820px; margin:0 auto; padding:0 24px}

.msg{margin-bottom:20px; display:flex; flex-direction:column}
.msg.user{align-items:flex-end}
.msg.assistant{align-items:flex-start}

.bubble{
  max-width:100%; padding:12px 16px; border-radius:12px; font-size:14px;
  line-height:1.65; white-space:pre-wrap; word-break:break-word;
  position:relative;
}
.msg.user .bubble{background:var(--user); border:1px solid #2d3d5c}
.msg.assistant .bubble{background:var(--ai); border:1px solid var(--line)}

.msg-actions{
  display:flex; gap:6px; margin-top:6px; opacity:0; transition:.15s;
}
.msg:hover .msg-actions{opacity:1}
.msg-actions button{
  font-size:11px; padding:3px 8px; border-radius:5px; cursor:pointer;
  background:transparent; color:var(--fg2); border:1px solid var(--line);
}
.msg-actions button:hover{color:var(--fg); border-color:var(--accent)}
.msg-actions button.danger:hover{color:#fff; background:var(--danger); border-color:var(--danger)}

.branch-badge{
  font-size:11px; color:var(--fg2); margin-bottom:4px;
  display:flex; gap:6px; align-items:center;
}
.branch-badge button{
  background:transparent; border:1px solid var(--line); color:var(--fg2);
  border-radius:4px; font-size:11px; padding:1px 6px; cursor:pointer;
}
.branch-badge button:hover{color:var(--fg); border-color:var(--accent)}

.meta-line{
  font-size:11px; color:var(--fg2); margin-top:4px;
}

.edit-box{width:100%}
.edit-box textarea{
  width:100%; min-height:90px; background:var(--bg3); color:var(--fg);
  border:1px solid var(--accent); border-radius:10px; padding:12px;
  font:inherit; font-size:14px; line-height:1.6; resize:vertical; outline:none;
}
.edit-box .row{display:flex; gap:8px; margin-top:8px; justify-content:flex-end}
.edit-box button{
  padding:6px 14px; border-radius:6px; font-size:12px; cursor:pointer;
  border:1px solid var(--line); background:var(--bg3); color:var(--fg);
}
.edit-box button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.edit-box button.primary:hover{background:var(--accent2)}

.cursor{
  display:inline-block; width:2px; height:1em; background:var(--accent);
  vertical-align:text-bottom; animation:blink 1s steps(2) infinite;
}
@keyframes blink{50%{opacity:0}}

.empty{
  text-align:center; color:var(--fg2); font-size:13px; margin-top:80px;
}

/* ---------- 输入区 ---------- */
#composer{
  border-top:1px solid var(--line); padding:12px 24px 16px; background:var(--bg2);
}
#composer .inner{
  max-width:820px; margin:0 auto; display:flex; gap:10px; align-items:flex-end;
}
#input{
  flex:1; background:var(--bg3); color:var(--fg); border:1px solid var(--line);
  border-radius:12px; padding:12px 14px; font:inherit; font-size:14px;
  line-height:1.5; resize:none; outline:none; max-height:220px;
}
#input:focus{border-color:var(--accent)}
#btn-send, #btn-stop{
  padding:12px 20px; border-radius:10px; border:none; cursor:pointer;
  font-size:14px; font-weight:600; transition:.15s;
}
#btn-send{background:var(--accent); color:#fff}
#btn-send:hover{background:var(--accent2)}
#btn-send:disabled{opacity:.4; cursor:not-allowed}
#btn-stop{background:var(--danger); color:#fff; display:none}

/* ---------- 弹窗 ---------- */
.modal{
  position:fixed; inset:0; background:rgba(0,0,0,.6);
  display:flex; align-items:center; justify-content:center; z-index:100;
}
.modal.hidden{display:none}
.modal-box{
  background:var(--bg2); border:1px solid var(--line); border-radius:14px;
  width:min(760px,92vw); max-height:86vh; display:flex; flex-direction:column;
}
.modal-head{
  padding:16px 20px; border-bottom:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:center;
}
.modal-head h3{font-size:15px}
.modal-head button{
  background:transparent; border:none; color:var(--fg2); font-size:20px;
  cursor:pointer; line-height:1;
}
.modal-head button:hover{color:var(--fg)}
.modal-body{padding:20px; overflow-y:auto; flex:1}
.field{margin-bottom:14px}
.field label{display:block; font-size:12px; color:var(--fg2); margin-bottom:5px}
.field input, .field select, .field textarea{
  width:100%; background:var(--bg3); color:var(--fg);
  border:1px solid var(--line); border-radius:8px; padding:9px 11px;
  font:inherit; font-size:13px; outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:80px; resize:vertical; font-family:ui-monospace,Menlo,monospace}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.hint{font-size:11px; color:var(--fg2); margin-top:4px; line-height:1.5}
.model-list{display:flex; flex-direction:column; gap:8px; margin-bottom:20px}
.model-row{
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  background:var(--bg3); border:1px solid var(--line); border-radius:8px;
}
.model-row .info{flex:1; min-width:0}
.model-row .nm{font-size:13px; font-weight:600}
.model-row .meta{font-size:11px; color:var(--fg2); margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.model-row button{
  font-size:12px; padding:5px 10px; border-radius:6px; cursor:pointer;
  background:transparent; border:1px solid var(--line); color:var(--fg2);
}
.model-row button:hover{color:var(--fg); border-color:var(--accent)}
.model-row button.del:hover{color:#fff; background:var(--danger); border-color:var(--danger)}
.btn-primary{
  padding:9px 18px; border-radius:8px; border:none; cursor:pointer;
  background:var(--accent); color:#fff; font-size:13px; font-weight:600;
}
.btn-primary:hover{background:var(--accent2)}
.divider{height:1px; background:var(--line); margin:18px 0}
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--danger); color:#fff; padding:10px 18px; border-radius:8px;
  font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:200;
}
#toast.show{opacity:1}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2a3038;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a424c}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head"><button id="btn-new">＋ 新建对话</button></div>
    <div id="conv-list"></div>
    <div class="side-foot"><button id="btn-settings">⚙ 模型设置</button></div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div id="title">mxy-harness</div>
      <select id="model-select"></select>
    </header>
    <div id="messages"><div class="wrap" id="msg-wrap"></div></div>
    <div id="composer">
      <div class="inner">
        <textarea id="input" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="btn-send">发送</button>
        <button id="btn-stop">停止</button>
      </div>
    </div>
  </main>
</div>

<!-- 设置弹窗 -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3>模型配置</h3>
      <button id="btn-close-modal">×</button>
    </div>
    <div class="modal-body">
      <div class="model-list" id="model-list"></div>
      <div class="divider"></div>
      <h3 style="font-size:14px;margin-bottom:14px" id="form-title">新增模型</h3>
      <div id="model-form">
        <div class="row2">
          <div class="field"><label>ID（唯一标识）</label><input id="f-id" placeholder="my-model"></div>
          <div class="field"><label>显示名称</label><input id="f-name" placeholder="My Model"></div>
        </div>
        <div class="row2">
          <div class="field">
            <label>Provider</label>
            <select id="f-provider">
              <option value="openai">OpenAI 兼容（含 DeepSeek、各类中转）</option>
              <option value="anthropic">Anthropic</option>
              <option value="ollama">Ollama（本地）</option>
              <option value="custom">Custom（任意 HTTP，自定义模板）</option>
            </select>
          </div>
          <div class="field"><label>模型名</label><input id="f-model" placeholder="deepseek-chat"></div>
        </div>
        <div class="field">
          <label>接口 URL</label>
          <input id="f-url" placeholder="https://api.deepseek.com/v1/chat/completions">
          <div class="hint">OpenAI 兼容：填完整 chat/completions 地址；Ollama：<code>http://127.0.0.1:11434/api/chat</code></div>
        </div>
        <div class="row2">
          <div class="field">
            <label>API Key</label>
            <input id="f-key" placeholder="sk-...">
          </div>
          <div class="field">
            <label>请求超时（秒）</label>
            <input id="f-maxtime" type="number" value="900" min="1">
          </div>
        </div>
        <div class="field">
          <label>系统提示词</label>
          <textarea id="f-sys" placeholder="You are a helpful assistant."></textarea>
        </div>

        <div id="custom-fields" style="display:none">
          <div class="divider"></div>
          <div class="field">
            <label>额外请求头（每行一个 <code>Key: Value</code>）</label>
            <textarea id="f-headers" placeholder="Authorization: Bearer xxx&#10;X-Custom: abc"></textarea>
          </div>
          <div class="row2">
            <div class="field">
              <label>流模式</label>
              <select id="f-smode">
                <option value="sse">SSE（data: {...}）</option>
                <option value="ndjson">NDJSON（每行一个 JSON）</option>
                <option value="text">纯文本流</option>
                <option value="none">非流式（一次性返回）</option>
              </select>
            </div>
            <div class="field"><label>流式增量路径</label><input id="f-spath" placeholder="choices.0.delta.content"></div>
          </div>
          <div class="field">
            <label>非流式响应路径</label>
            <input id="f-rpath" placeholder="choices.0.message.content">
          </div>
          <div class="field">
            <label>请求体模板（可选）</label>
            <textarea id="f-tpl" placeholder='{"model":"{{model}}","messages":{{messages}},"stream":true}'></textarea>
            <div class="hint">可用占位符：<code>{{model}}</code> <code>{{messages}}</code> <code>{{prompt}}</code> <code>{{system}}</code></div>
          </div>
          <div class="field">
            <label>额外参数（JSON，合并进请求体）</label>
            <textarea id="f-extra" placeholder='{"temperature":0.7}'></textarea>
          </div>
        </div>

        <div id="common-extra" style="display:none">
          <div class="divider"></div>
          <div class="field">
            <label>额外参数（JSON，合并进请求体）</label>
            <textarea id="f-extra2" placeholder='{"temperature":0.7,"max_tokens":4096}'></textarea>
          </div>
        </div>

        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
          <button class="btn-primary" id="btn-save-model">保存模型</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= 工具 ================= */
const $ = (s) => document.querySelector(s);
const el = (tag, cls, txt) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
};
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 3000);
}
function rid() {
  return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ================= WebSocket ================= */
let ws = null;
const pending = {};
let wsReady = false;

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { wsReady = true; };
  ws.onclose = () => {
    wsReady = false;
    for (const k in pending) {
      const h = pending[k];
      delete pending[k];
      h.onError && h.onError('连接已断开');
    }
    setTimeout(connectWS, 1200);
  };
  ws.onerror = () => {};
  ws.onmessage = (e) => {
    let ev;
    try { ev = JSON.parse(e.data); } catch { return; }
    const h = pending[ev.id];
    if (!h) return;
    if (ev.type === 'delta') {
      h.onDelta && h.onDelta(ev.text || '');
    } else if (ev.type === 'done') {
      delete pending[ev.id];
      h.onDone && h.onDone(ev.data || {});
    } else if (ev.type === 'result') {
      delete pending[ev.id];
      h.onDone && h.onDone(ev.data);
    } else if (ev.type === 'error') {
      delete pending[ev.id];
      h.onError && h.onError(ev.message || 'unknown error');
    }
  };
}

// [Fix 小-9] 用指数退避替代 setInterval，避免累积 timer
function wsCall(cmd, params, handlers = {}) {
  const id = rid();
  const payload = { id, cmd, params: params || {} };
  pending[id] = handlers;

  const trySend = (attemptsLeft) => {
    if (wsReady) {
      try { ws.send(JSON.stringify(payload)); return; }
      catch (e) {
        delete pending[id];
        handlers.onError && handlers.onError('发送失败: ' + e.message);
        return;
      }
    }
    if (attemptsLeft <= 0) {
      delete pending[id];
      handlers.onError && handlers.onError('WebSocket 未连接');
      return;
    }
    setTimeout(() => trySend(attemptsLeft - 1), 100);
  };
  trySend(80); // 最多等 8s
  return id;
}

function wsCancel(targetId) {
  if (wsReady) ws.send(JSON.stringify({ id: rid(), cmd: 'cancel', params: { target: targetId } }));
}

/* ================= 状态 ================= */
const state = {
  convId: null,
  models: [],
  conversations: [],
  messages: [],
  streaming: false,
  streamReqId: null,
  editingId: null,
};

/* ================= 渲染 ================= */
function renderConvList() {
  const box = $('#conv-list');
  box.innerHTML = '';
  if (!state.conversations.length) {
    box.appendChild(el('div', 'empty', '暂无对话'));
    return;
  }
  for (const c of state.conversations) {
    const item = el('div', 'conv-item' + (c.id === state.convId ? ' active' : ''));
    const t = el('div', 't', c.title || 'Untitled');
    const x = el('div', 'x', '×');
    x.title = '删除对话';
    x.onclick = (e) => {
      e.stopPropagation();
      if (!confirm('删除该对话？')) return;
      wsCall('delete_conversation', { conv_id: c.id }, {
        onDone: () => {
          if (state.convId === c.id) {
            state.convId = null;
            state.messages = [];
            renderMessages();
          }
          loadConversations();
        },
        onError: toast,
      });
    };
    item.appendChild(t);
    item.appendChild(x);
    item.onclick = () => selectConversation(c.id);
    box.appendChild(item);
  }
}

function renderModelSelect() {
  const sel = $('#model-select');
  sel.innerHTML = '';
  if (!state.models.length) {
    const o = el('option', null, '（无模型，请先配置）');
    o.value = '';
    sel.appendChild(o);
    return;
  }
  for (const m of state.models) {
    const o = el('option', null, m.name || m.id);
    o.value = m.id;
    sel.appendChild(o);
  }
  const cur = state.conversations.find(c => c.id === state.convId);
  if (cur && cur.model_id) sel.value = cur.model_id;
}

function renderMessages() {
  const wrap = $('#msg-wrap');
  wrap.innerHTML = '';

  if (!state.convId) {
    wrap.appendChild(el('div', 'empty', '选择或新建一个对话开始'));
    return;
  }
  if (!state.messages.length) {
    wrap.appendChild(el('div', 'empty', '发送第一条消息开始对话'));
    return;
  }

  for (const m of state.messages) {
    wrap.appendChild(renderMessage(m));
  }
  scrollBottom();
}

function renderMessage(m) {
  const box = el('div', 'msg ' + (m.role === 'user' ? 'user' : 'assistant'));

  if (m.children && m.children.length > 1) {
    const badge = el('div', 'branch-badge');
    badge.appendChild(el('span', null, `分支 ${m.children.length}`));
    m.children.forEach((cid, i) => {
      const b = el('button', null, String(i + 1));
      b.title = '切换到该分支';
      b.onclick = () => {
        wsCall('set_active_leaf', { conv_id: state.convId, message_id: cid }, {
          onDone: () => reloadConversation(),
          onError: toast,
        });
      };
      badge.appendChild(b);
    });
    box.appendChild(badge);
  }

  if (state.editingId === m.id) {
    box.appendChild(renderEditBox(m));
    return box;
  }

  const bubble = el('div', 'bubble');
  bubble.textContent = m.content;
  if (m._streaming) {
    const cur = el('span', 'cursor');
    bubble.appendChild(cur);
  }
  box.appendChild(bubble);

  const actions = el('div', 'msg-actions');

  const bEdit = el('button', null, '编辑');
  bEdit.onclick = () => {
    state.editingId = m.id;
    renderMessages();
    const ta = document.querySelector('.edit-box textarea');
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  };
  actions.appendChild(bEdit);

  if (m.role === 'assistant') {
    const bRegen = el('button', null, '重新生成');
    bRegen.onclick = () => regenerate();
    actions.appendChild(bRegen);
  }

  const bBranch = el('button', null, '从这里分支');
  bBranch.title = '将当前分支点设置到此消息，之后发送的消息将成为新的分支';
  bBranch.onclick = () => {
    wsCall('set_active_leaf', { conv_id: state.convId, message_id: m.id }, {
      onDone: () => {
        toast('已切换分支点，发送新消息即可创建分支');
        reloadConversation();
      },
      onError: toast,
    });
  };
  actions.appendChild(bBranch);

  const bDel = el('button', 'danger', '删除');
  bDel.onclick = () => {
    if (!confirm('删除该消息及其后续所有内容？')) return;
    wsCall('delete_message', { conv_id: state.convId, message_id: m.id }, {
      onDone: () => reloadConversation(),
      onError: toast,
    });
  };
  actions.appendChild(bDel);

  box.appendChild(actions);
  return box;
}

function renderEditBox(m) {
  const box = el('div', 'edit-box');
  const ta = el('textarea');
  ta.value = m.content;

  const row = el('div', 'row');

  const cancel = el('button', null, '取消');
  cancel.onclick = () => { state.editingId = null; renderMessages(); };

  const saveOnly = el('button', null, '仅保存');
  saveOnly.onclick = () => doEdit(m.id, ta.value, false);

  const saveRegen = el('button', 'primary', m.role === 'user' ? '保存并重新生成' : '保存并重新生成');
  saveRegen.onclick = () => doEdit(m.id, ta.value, true);

  row.appendChild(cancel);
  row.appendChild(saveOnly);
  row.appendChild(saveRegen);
  box.appendChild(ta);
  box.appendChild(row);

  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { state.editingId = null; renderMessages(); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) saveRegen.click();
  });

  return box;
}

// [Fix #6] onError 也要调 finishStream
function doEdit(messageId, content, regenerate) {
  state.editingId = null;
  if (regenerate) startStreamVisual();

  wsCall('edit_message', {
    conv_id: state.convId,
    message_id: messageId,
    content,
    regenerate,
  }, {
    onDone: () => {
      if (regenerate) finishStream();
      else reloadConversation();
    },
    onError: (e) => {
      toast(e);
      if (regenerate) finishStream();
      else reloadConversation();
    },
  });
}

function scrollBottom() {
  const box = $('#messages');
  box.scrollTop = box.scrollHeight;
}

/* ================= 数据加载 ================= */
function loadModels() {
  wsCall('list_models', {}, {
    onDone: (data) => {
      state.models = data || [];
      renderModelSelect();
    },
    onError: toast,
  });
}

function loadConversations() {
  wsCall('list_conversations', {}, {
    onDone: (data) => {
      state.conversations = data || [];
      renderConvList();
      renderModelSelect();
    },
    onError: toast,
  });
}

function selectConversation(cid) {
  state.convId = cid;
  state.editingId = null;
  // [Fix #11] 切会话清空临时消息
  state.messages = [];
  renderConvList();
  reloadConversation();
}

function reloadConversation() {
  if (!state.convId) { state.messages = []; renderMessages(); return; }
  const wantId = state.convId;
  wsCall('get_conversation', { conv_id: wantId }, {
    onDone: (data) => {
      if (state.convId !== wantId) return;  // 切走了，丢弃过期响应
      state.messages = (data && data.messages) || [];
      $('#title').textContent = (data && data.title) || 'mxy-harness';
      if (data && data.model_id) $('#model-select').value = data.model_id;
      renderMessages();
    },
    onError: toast,
  });
}

/* ================= 发送 / 流式 ================= */
function startStreamVisual() {
  state.streaming = true;
  $('#btn-send').style.display = 'none';
  $('#btn-stop').style.display = 'block';
}

// [Fix #6][Fix #11] 清掉乐观渲染的临时消息，再 reload
function finishStream() {
  state.streaming = false;
  state.streamReqId = null;
  state.messages = state.messages.filter(m => !m._streaming);
  $('#btn-send').style.display = 'block';
  $('#btn-stop').style.display = 'none';
  $('#btn-send').disabled = false;
  reloadConversation();
  loadConversations();
}

function sendMessage() {
  const input = $('#input');
  const text = input.value.trim();
  if (!text || state.streaming) return;
  if (!state.convId) {
    toast('请先新建对话');
    return;
  }

  const modelId = $('#model-select').value;

  // 乐观渲染：两条消息都标 _streaming，finishStream 时统一清掉
  const userMsg = { id: '_tmp_u', role: 'user', content: text, children: [], _streaming: true };
  const asstMsg = { id: '_tmp_a', role: 'assistant', content: '', children: [], _streaming: true };
  state.messages.push(userMsg, asstMsg);
  renderMessages();
  input.value = '';
  autoGrow(input);

  startStreamVisual();

  const reqId = wsCall('chat', {
    conv_id: state.convId,
    content: text,
    model_id: modelId,
  }, {
    onDelta: (t) => {
      const last = state.messages[state.messages.length - 1];
      if (last && last._streaming && last.role === 'assistant') {
        last.content += t;
        const bubbles = document.querySelectorAll('#msg-wrap .msg.assistant .bubble');
        const b = bubbles[bubbles.length - 1];
        if (b) {
          b.textContent = last.content;
          const cur = el('span', 'cursor');
          b.appendChild(cur);
        }
        scrollBottom();
      }
    },
    onDone: () => finishStream(),
    onError: (msg) => {
      toast('错误: ' + msg);
      finishStream();
    },
  });

  state.streamReqId = reqId;
}

function regenerate() {
  if (state.streaming) return;
  const modelId = $('#model-select').value;
  startStreamVisual();
  wsCall('regenerate', { conv_id: state.convId, model_id: modelId }, {
    onDone: () => finishStream(),
    onError: (msg) => { toast(msg); finishStream(); },
  });
}

/* ================= 模型设置 ================= */
function openSettings() {
  $('#settings-modal').classList.remove('hidden');
  renderModelList();
  resetModelForm();
}

function renderModelList() {
  const box = $('#model-list');
  box.innerHTML = '';
  if (!state.models.length) {
    box.appendChild(el('div', 'empty', '还没有模型，添加一个吧'));
    return;
  }
  for (const m of state.models) {
    const row = el('div', 'model-row');
    const info = el('div', 'info');
    info.appendChild(el('div', 'nm', m.name || m.id));
    info.appendChild(el('div', 'meta', `${m.provider} · ${m.model || '?'} · ${m.base_url || m.url || ''}`));
    row.appendChild(info);

    const edit = el('button', null, '编辑');
    edit.onclick = () => fillModelForm(m);
    row.appendChild(edit);

    const del = el('button', 'del', '删除');
    del.onclick = () => {
      if (!confirm('删除模型 ' + (m.name || m.id) + '？')) return;
      wsCall('delete_model', { id: m.id }, {
        onDone: () => { loadModels(); setTimeout(renderModelList, 200); },
        onError: toast,
      });
    };
    row.appendChild(del);
    box.appendChild(row);
  }
}

let editingModelId = null;

function resetModelForm() {
  editingModelId = null;
  $('#form-title').textContent = '新增模型';
  $('#f-id').value = '';
  $('#f-name').value = '';
  $('#f-provider').value = 'openai';
  $('#f-model').value = '';
  $('#f-url').value = '';
  $('#f-key').value = '';
  $('#f-maxtime').value = '900';
  $('#f-sys').value = '';
  $('#f-headers').value = '';
  $('#f-smode').value = 'sse';
  $('#f-spath').value = 'choices.0.delta.content';
  $('#f-rpath').value = 'choices.0.message.content';
  $('#f-tpl').value = '';
  $('#f-extra').value = '';
  $('#f-extra2').value = '';
  updateProviderFields();
}

function fillModelForm(m) {
  editingModelId = m.id;
  $('#form-title').textContent = '编辑模型：' + (m.name || m.id);
  $('#f-id').value = m.id || '';
  $('#f-name').value = m.name || '';
  $('#f-provider').value = m.provider || 'openai';
  $('#f-model').value = m.model || '';
  $('#f-url').value = m.base_url || m.url || '';
  $('#f-key').value = m.api_key || '';
  $('#f-maxtime').value = String(m.max_time || 900);
  $('#f-sys').value = m.system_prompt || '';
  const hs = m.headers || {};
  $('#f-headers').value = Object.entries(hs).map(([k, v]) => `${k}: ${v}`).join('\n');
  $('#f-smode').value = m.stream_mode || 'sse';
  $('#f-spath').value = m.stream_path || 'choices.0.delta.content';
  $('#f-rpath').value = m.response_path || 'choices.0.message.content';
  $('#f-tpl').value = m.body_template || '';
  const extra = JSON.stringify(m.params || {}, null, 2);
  $('#f-extra').value = extra === '{}' ? '' : extra;
  $('#f-extra2').value = extra === '{}' ? '' : extra;
  updateProviderFields();
}

function updateProviderFields() {
  const p = $('#f-provider').value;
  $('#custom-fields').style.display = (p === 'custom') ? 'block' : 'none';
  $('#common-extra').style.display = (p === 'custom') ? 'none' : 'block';
  const urlInput = $('#f-url');
  if (p === 'openai')  urlInput.placeholder = 'https://api.deepseek.com/v1/chat/completions';
  if (p === 'anthropic') urlInput.placeholder = 'https://api.anthropic.com/v1/messages';
  if (p === 'ollama')  urlInput.placeholder = 'http://127.0.0.1:11434/api/chat';
  if (p === 'custom')  urlInput.placeholder = 'https://api.smallcorp.com/v1/generate';
}

function parseHeaders(txt) {
  const out = {};
  for (const line of (txt || '').split('\n')) {
    const s = line.trim();
    if (!s) continue;
    const i = s.indexOf(':');
    if (i <= 0) continue;
    out[s.slice(0, i).trim()] = s.slice(i + 1).trim();
  }
  return out;
}

function saveModel() {
  const p = $('#f-provider').value;
  let extra = {};
  const extraRaw = (p === 'custom' ? $('#f-extra').value : $('#f-extra2').value).trim();
  if (extraRaw) {
    try { extra = JSON.parse(extraRaw); }
    catch (e) { toast('额外参数 JSON 解析失败'); return; }
  }

  const id = $('#f-id').value.trim() || ('m_' + Math.random().toString(36).slice(2, 8));
  const maxTime = parseInt($('#f-maxtime').value, 10) || 900;
  const cfg = {
    id,
    name: $('#f-name').value.trim() || id,
    provider: p,
    model: $('#f-model').value.trim(),
    api_key: $('#f-key').value.trim(),
    system_prompt: $('#f-sys').value.trim(),
    max_time: maxTime,
    base_url: (p === 'custom') ? '' : $('#f-url').value.trim(),
    url: (p === 'custom') ? $('#f-url').value.trim() : '',
    headers: parseHeaders($('#f-headers').value),
    params: extra,
    stream_mode: $('#f-smode').value,
    stream_path: $('#f-spath').value.trim(),
    response_path: $('#f-rpath').value.trim(),
    body_template: $('#f-tpl').value.trim(),
    method: 'POST',
  };

  wsCall('save_model', cfg, {
    onDone: () => {
      toast('已保存');
      loadModels();
      setTimeout(renderModelList, 250);
      resetModelForm();
    },
    onError: toast,
  });
}

/* ================= 输入框自适应高度 ================= */
function autoGrow(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 220) + 'px';
}

/* ================= 事件绑定 ================= */
function boot() {
  connectWS();

  $('#btn-new').onclick = () => {
    const modelId = $('#model-select').value || (state.models[0] && state.models[0].id) || '';
    wsCall('new_conversation', { model_id: modelId, title: 'New chat' }, {
      onDone: (d) => {
        state.convId = d.id;
        state.messages = [];
        loadConversations();
        renderMessages();
        $('#title').textContent = 'New chat';
        $('#input').focus();
      },
      onError: toast,
    });
  };

  $('#btn-settings').onclick = openSettings;
  $('#btn-close-modal').onclick = () => $('#settings-modal').classList.add('hidden');
  $('#settings-modal').onclick = (e) => {
    if (e.target.id === 'settings-modal') $('#settings-modal').classList.add('hidden');
  };
  $('#f-provider').onchange = updateProviderFields;
  $('#btn-save-model').onclick = saveModel;

  $('#btn-send').onclick = sendMessage;

  $('#btn-stop').onclick = () => {
    if (state.streamReqId) wsCancel(state.streamReqId);
    toast('已请求停止');
  };

  $('#input').addEventListener('input', (e) => autoGrow(e.target));
  $('#input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  $('#model-select').onchange = (e) => {
    if (!state.convId) return;
    const mid = e.target.value;
    const c = state.conversations.find(x => x.id === state.convId);
    if (c) c.model_id = mid;
  };

  loadModels();
  loadConversations();
  autoGrow($('#input'));
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
